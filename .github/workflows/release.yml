name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, e.g. 1.0.1.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ github.event.inputs.version }}"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          # Jellyfin wants a four-part version
          case "$(echo "$V" | awk -F. '{print NF}')" in
            3) V="$V.0" ;;
            2) V="$V.0.0" ;;
          esac
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Install jprm
        run: python -m pip install --upgrade jprm

      - name: Build plugin package
        id: build
        run: |
          ZIP=$(jprm --verbosity=debug plugin build . \
            --output ./artifacts --version "${{ steps.v.outputs.version }}")
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Update repository manifest
        run: |
          jprm repo add --url \
            "https://github.com/${{ github.repository }}/releases/download/v${{ steps.v.outputs.version }}" \
            ./manifest.json "${{ steps.build.outputs.zip }}"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.v.outputs.version }}" \
            --title "NetflixFin ${{ steps.v.outputs.version }}" \
            --generate-notes \
            "${{ steps.build.outputs.zip }}" || \
          gh release upload "v${{ steps.v.outputs.version }}" \
            "${{ steps.build.outputs.zip }}" --clobber

      - name: Commit manifest
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add manifest.json
          git diff --cached --quiet || \
            git commit -m "chore: manifest for ${{ steps.v.outputs.version }}"
          git push origin main
