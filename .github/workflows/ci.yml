name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore Jellyfin.Plugin.NetflixFin/Jellyfin.Plugin.NetflixFin.csproj

      - name: Build
        run: >
          dotnet build Jellyfin.Plugin.NetflixFin/Jellyfin.Plugin.NetflixFin.csproj
          --configuration Release --no-restore

      - name: Package
        run: |
          dotnet publish Jellyfin.Plugin.NetflixFin/Jellyfin.Plugin.NetflixFin.csproj \
            --configuration Release --output ./publish
          mkdir -p artifacts
          cd publish && zip -r ../artifacts/netflixfin.zip Jellyfin.Plugin.NetflixFin.dll

      - uses: actions/upload-artifact@v4
        with:
          name: netflixfin-plugin
          path: artifacts/netflixfin.zip
